name: Test, Build and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run Playwright tests
        run: pnpm test:e2e

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.REGISTRY }}:5000/${{ vars.IMAGE_NAME }}:latest -t ${{ secrets.REGISTRY }}:5000/${{ vars.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push image to registry
        run: |
          docker push ${{ secrets.REGISTRY }}:5000/${{ vars.IMAGE_NAME }}:latest
          docker push ${{ secrets.REGISTRY }}:5000/${{ vars.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Redeploy the Swarm Stack
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "docker service update stack_${{ vars.IMAGE_NAME }} --image ${{ secrets.REGISTRY }}:5000/${{ vars.IMAGE_NAME }}:${{ github.sha }}"
