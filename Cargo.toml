[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
drop-core = { path = "crates/core" }

async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
httpdate = "1.0.3"
mime_guess = "2.0.5"
notify = "8.2.2"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
rtc = { version = "0.21.1", default-features = false }
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
unicode-width = "0.2.3"
url = "2.5.8"
webpki-roots = "1.0.12"
webrtc = "0.21.1"
winresource = "0.1.34"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
